services:
  - type: web
    name: farm-registry-api-demo
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FARM_REGISTRY_CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
